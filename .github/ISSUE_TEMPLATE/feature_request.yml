name: 功能建议
description: 建议新的能力或交互改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述真实使用场景，而不只是期望的实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: textarea
    id: safety
    attributes:
      label: 对网络设置与恢复流程的影响
      description: 如果涉及系统代理、权限或进程启动，请说明预期边界。
